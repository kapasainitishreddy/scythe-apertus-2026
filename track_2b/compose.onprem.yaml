# Optional sovereign deployment on compatible NVIDIA GPUs.
# This uses the official Swiss AI Initiative image and documented vLLM flags.
# Accept the gated model terms at Hugging Face before starting.
services:
  app:
    environment:
      LLM_NAME: swiss-ai/Apertus-v1.5-8B
      LLM_BASE_URL: http://apertus:8000/v1
      LLM_API_KEY: ""
  apertus:
    image: ghcr.io/swiss-ai/vllm_apertus_1.5_release:latest-amd64
    gpus: all
    shm_size: "1gb"
    command:
      - vllm
      - serve
      - swiss-ai/Apertus-v1.5-8B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --chat-template-content-format
      - string
      - --gpu-memory-utilization
      - "0.6"
      - --max-model-len
      - "8192"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - apertus
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - model_cache:/root/.cache/huggingface
volumes:
  model_cache:
