services:
  app:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      LLM_NAME: "${LLM_NAME:-swiss-ai/Apertus-v1.5-8B}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      REQUEST_DIR: /queue/requests
      RESULT_DIR: /queue/results
      EVIDENCE_DIR: /artifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    pids_limit: 96
    mem_limit: 512m
    volumes:
      - requests:/queue/requests
      - responses:/queue/results:ro
      - evidence:/artifacts
    depends_on:
      - verifier
  verifier:
    build: .
    command: ["node", "src/verifier.mjs"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    pids_limit: 64
    mem_limit: 384m
    cpus: 1.0
    environment:
      REQUEST_DIR: /queue/requests
      RESULT_DIR: /queue/results
      # Deliberately no LLM_BASE_URL and no LLM_API_KEY.
    volumes:
      - requests:/queue/requests:ro
      - responses:/queue/results
volumes:
  requests:
  responses:
  evidence:
